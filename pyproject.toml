[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes_nn"
version = "0.1.0"
authors = [
    { name="Yutaka Koga", email="yukoga@gmail.com" },
]
description = "A simple Bayesian Neural Network library using PyTorch"
readme = "README.md"
requires-python = ">=3.11"
# License set based on setup.cfg (Apache-2.0)
license = { text="Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License", # Updated based on setup.cfg
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.4",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "scikit-learn>=0.24",
    "graphviz>=0.20.3",
    "torchvision>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/yukoga/bayes_nn"
Repository = "https://github.com/yukoga/bayes_nn"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8", # Added linter
    "mypy",   # Added type checker
    "data-science-types", # For sklearn stubs
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.5", # From original file
    "flake8",
    "mypy",
    "data-science-types",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
